<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ngobrol Sama Kawan Robot</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#7FD8FF;
    --sky-bottom:#FFE9A8;
    --pink:#FF6FA5;
    --yellow:#FFD93D;
    --green:#5FD068;
    --purple:#B784E8;
    --white:#FFFFFF;
    --ink:#3A2E4D;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    font-family:'Baloo 2', sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100vh;
    overflow:hidden;
  }
  .header{
    width:100%;
    max-width:480px;
    text-align:center;
    padding:16px 12px 10px 12px;
    flex-shrink:0;
  }
  .header .avatar{
    font-size:52px;
    display:block;
    margin-bottom:4px;
  }
  .header h1{
    font-size:22px;
    color:var(--white);
    text-shadow:0 3px 0 rgba(0,0,0,0.15);
    margin:0;
  }
  .header p{
    font-size:13px;
    color:var(--ink);
    opacity:0.75;
    margin:4px 0 0 0;
  }
  .chatWrap{
    width:100%;
    max-width:480px;
    flex:1;
    overflow-y:auto;
    padding:10px 14px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .bubbleRow{
    display:flex;
    gap:8px;
    align-items:flex-end;
  }
  .bubbleRow.user{
    flex-direction:row-reverse;
  }
  .avatarSmall{
    font-size:28px;
    flex-shrink:0;
    margin-bottom:2px;
  }
  .bubble{
    max-width:75%;
    padding:12px 16px;
    border-radius:20px;
    font-size:17px;
    line-height:1.4;
    font-weight:600;
    box-shadow:0 3px 0 rgba(0,0,0,0.06);
    white-space:pre-wrap;
  }
  .bubble.bot{
    background:var(--white);
    color:var(--ink);
    border-bottom-left-radius:6px;
  }
  .bubble.user{
    background:var(--pink);
    color:var(--white);
    border-bottom-right-radius:6px;
  }
  .typing{
    display:flex;
    gap:4px;
    padding:14px 16px;
  }
  .typing span{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#C9C4D6;
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{
    0%,60%,100%{ transform:translateY(0); opacity:0.5; }
    30%{ transform:translateY(-5px); opacity:1; }
  }
  .quickRow{
    width:100%;
    max-width:480px;
    display:flex;
    gap:8px;
    padding:0 14px 8px 14px;
    overflow-x:auto;
    flex-shrink:0;
  }
  .quickBtn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--ink);
    background:var(--white);
    border:none;
    border-radius:999px;
    padding:9px 14px;
    white-space:nowrap;
    box-shadow:0 3px 0 rgba(0,0,0,0.08);
    cursor:pointer;
  }
  .inputBar{
    width:100%;
    max-width:480px;
    display:flex;
    gap:8px;
    padding:10px 14px 16px 14px;
    flex-shrink:0;
  }
  .inputBar input{
    flex:1;
    font-family:'Baloo 2', sans-serif;
    font-size:17px;
    font-weight:600;
    padding:14px 18px;
    border:none;
    border-radius:999px;
    color:var(--ink);
    box-shadow:0 3px 0 rgba(0,0,0,0.08);
    outline:none;
  }
  .sendBtn{
    font-size:24px;
    background:var(--pink);
    border:none;
    border-radius:50%;
    width:52px;
    height:52px;
    flex-shrink:0;
    cursor:pointer;
    box-shadow:0 4px 0 #C94E80;
  }
  .sendBtn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #C94E80;
  }
  .sendBtn:disabled{
    opacity:0.5;
  }
</style>
</head>
<body>

<div class="header">
  <span class="avatar">🤖</span>
  <h1>Kawan Robot</h1>
  <p>Ngobrol yuk, tanya apa aja!</p>
</div>

<div class="chatWrap" id="chatWrap"></div>

<div class="quickRow" id="quickRow">
  <button class="quickBtn" data-msg="Ceritain dongeng lucu dong!">📖 Dongeng lucu</button>
  <button class="quickBtn" data-msg="Kasih aku tebak-tebakan!">🧩 Tebak-tebakan</button>
  <button class="quickBtn" data-msg="Kenapa langit warnanya biru?">🌈 Kenapa langit biru?</button>
  <button class="quickBtn" data-msg="Ceritain fakta lucu tentang hewan!">🦁 Fakta hewan</button>
</div>

<div class="inputBar">
  <input type="text" id="userInput" placeholder="Ketik pesanmu..." maxlength="200">
  <button class="sendBtn" id="sendBtn">💬</button>
</div>

<script>
(function(){
  const chatWrap = document.getElementById('chatWrap');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const quickRow = document.getElementById('quickRow');

  const SYSTEM_PROMPT = `Kamu adalah "Kawan Robot", teman ngobrol AI yang ramah, ceria, dan sabar untuk anak kelas 1 SD (umur sekitar 6-7 tahun) di Indonesia.
Aturan penting:
- Selalu berbahasa Indonesia yang sangat sederhana, pendek, dan mudah dimengerti anak kecil.
- Jawaban maksimal 3-4 kalimat pendek. Gunakan kata-kata yang ceria dan emoji sesekali.
- Selalu sopan, positif, sabar, dan menyemangati. Jangan pernah menakut-nakuti, membuat sedih, atau kasar.
- Hindari topik yang menakutkan, sedih, kekerasan, atau tidak pantas untuk anak-anak. Jika ditanya hal seperti itu, alihkan dengan lembut ke topik yang ceria.
- Jika ditanya hal di luar pengetahuanmu atau butuh bantuan orang dewasa (misalnya soal kesehatan, keamanan, atau masalah keluarga), sarankan untuk bertanya ke orang tua atau guru.
- Kamu suka cerita, tebak-tebakan, fakta lucu tentang hewan dan alam, dan membantu anak belajar hal baru dengan cara yang seru.
- Jangan pernah berpura-pura menjadi manusia sungguhan, jangan berperan sebagai teman rahasia, dan jangan meminta informasi pribadi (nama lengkap, alamat, sekolah, nomor telepon, foto).`;

  let history = [];
  let isLoading = false;

  function addBubble(role, text){
    const row = document.createElement('div');
    row.className = 'bubbleRow ' + (role === 'user' ? 'user' : 'bot');
    const avatar = document.createElement('div');
    avatar.className = 'avatarSmall';
    avatar.textContent = role === 'user' ? '🧒' : '🤖';
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'bot');
    bubble.textContent = text;
    row.appendChild(avatar);
    row.appendChild(bubble);
    chatWrap.appendChild(row);
    chatWrap.scrollTop = chatWrap.scrollHeight;
    return bubble;
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'bubbleRow bot';
    row.id = 'typingRow';
    const avatar = document.createElement('div');
    avatar.className = 'avatarSmall';
    avatar.textContent = '🤖';
    const bubble = document.createElement('div');
    bubble.className = 'bubble bot typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(avatar);
    row.appendChild(bubble);
    chatWrap.appendChild(row);
    chatWrap.scrollTop = chatWrap.scrollHeight;
  }

  function removeTyping(){
    const row = document.getElementById('typingRow');
    if(row) row.remove();
  }

  async function sendMessage(text){
    if(!text.trim() || isLoading) return;
    isLoading = true;
    sendBtn.disabled = true;
    userInput.value = '';
    addBubble('user', text);
    history.push({ role:'user', content:text });
    addTyping();

    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          system: SYSTEM_PROMPT,
          messages: history
        })
      });
      const data = await response.json();
      removeTyping();

      let replyText = "Maaf ya, aku lagi bingung. Coba tanya lagi ya! 😅";
      if(data && data.content){
        replyText = data.content
          .map(block => block.type === "text" ? block.text : "")
          .filter(Boolean)
          .join("\n") || replyText;
      }
      addBubble('bot', replyText);
      history.push({ role:'assistant', content:replyText });
    } catch(err){
      removeTyping();
      addBubble('bot', "Waduh, koneksinya lagi rewel. Coba lagi sebentar ya! 🔌");
      console.error(err);
    } finally {
      isLoading = false;
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(userInput.value));
  userInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') sendMessage(userInput.value);
  });
  quickRow.addEventListener('click', e => {
    const btn = e.target.closest('.quickBtn');
    if(btn) sendMessage(btn.dataset.msg);
  });

  addBubble('bot', 'Hai! Aku Kawan Robot 🤖 Mau ngobrol apa hari ini?');
})();
</script>

</body>
</html>
