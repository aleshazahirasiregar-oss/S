<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novan Setya • Co-Admin AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; }
        .chat-bubble { max-width: 75%; padding: 12px 16px; border-radius: 20px; position: relative; }
        .user { background: #3b82f6; color: white; border-bottom-right-radius: 4px; }
        .ai { background: #f1f5f9; color: #1e2937; border-bottom-left-radius: 4px; }
        .typing { display: inline-block; animation: typing 1s infinite; }
        @keyframes typing { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-zinc-900 border-r border-zinc-800 p-4 flex flex-col">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-2xl">🧠</div>
                <div>
                    <h1 class="text-2xl font-bold">Novan Setya</h1>
                    <p class="text-xs text-emerald-400">Co-Admin AI • 2026</p>
                </div>
            </div>
            
            <div class="space-y-2">
                <button onclick="toggleRobotIcon()" class="tab-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 bg-zinc-800 hover:bg-zinc-700">
                    <i class="fas fa-comments"></i> Chat Novan
                </button>
                <button onclick="switchTab(1)" class="tab-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 hover:bg-zinc-800">
                    <i class="fas fa-brain"></i> Tes Otak Novan
                </button>
                <button onclick="switchTab(2)" class="tab-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 hover:bg-zinc-800">
                    <i class="fas fa-gift"></i> Bonus Interaktif
                </button>
            </div>

            <div className="mt-auto">
                <button onclick="showAdminModal()" 
                        class="w-full bg-emerald-500 hover:bg-emerald-600 py-3 rounded-2xl font-semibold flex items-center justify-center gap-2">
                    <i class="fas fa-shield-alt"></i> Admin Panel
                </button>
            </div>
        </div>

        <!-- Main Chat -->
        <div class="flex-1 flex flex-col">
            <div class="bg-zinc-900 p-4 flex items-center justify-between border-b border-zinc-800">
                <div class="flex items-center gap-3">
                    <!-- IKon Robot -->
                    <div onclick="toggleRobotIcon()" id="robotIcon" 
                         class="w-10 h-10 bg-gradient-to-br from-purple-500 to-pink-500 rounded-3xl flex items-center justify-center text-4xl cursor-pointer hover:scale-110 transition-transform">
                        🤖
                    </div>
                    <div>
                        <div id="aiName" class="font-bold text-lg">Co-Admin Novan Setya</div>
                        <div id="statusText" class="text-emerald-400 text-sm flex items-center gap-1">
                            <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                            AI Manusia Mode • Lebih Pintar dari Claude
                        </div>
                    </div>
                </div>
                <button onclick="clearChat()" class="text-zinc-400 hover:text-white">Hapus Chat</button>
            </div>

            <!-- Chat Area -->
            <div id="chat" class="flex-1 p-6 overflow-y-auto space-y-6 bg-zinc-950"></div>

            <!-- Input -->
            <div class="p-4 bg-zinc-900 border-t border-zinc-800">
                <div class="flex gap-3">
                    <input id="userInput" type="text" placeholder="Tanya apa saja ke Novan Setya..." 
                           class="flex-1 bg-zinc-800 border border-zinc-700 rounded-3xl px-6 py-4 focus:outline-none focus:border-blue-500 text-white">
                    <button onclick="sendMessage()" 
                            class="bg-blue-600 hover:bg-blue-500 px-8 rounded-3xl font-semibold">Kirim</button>
                </div>
                
                <div class="mt-4 flex flex-wrap gap-3">
                    <button onclick="sendMessage('Apa yang bisa kamu lakukan?')" 
                            class="px-5 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-2xl text-sm">Cerita fakta seru</button>
                    <button onclick="sendMessage('Hitung berapa 7 x 8')" 
                            class="px-5 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-2xl text-sm">Hitung cepat</button>
                    <button onclick="sendMessage('Buat gambar lucu tentang Novan Setya')" 
                            class="px-5 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-2xl text-sm">Buat gambar</button>
                    <button onclick="sendRandomMessage()" 
                            class="px-5 py-2 bg-purple-600 hover:bg-purple-500 rounded-2xl text-sm font-bold">
                        <i class="fas fa-dice"></i> Chat Random
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Modal - Password tidak ditampilkan -->
    <div id="adminModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-zinc-900 w-full max-w-md rounded-3xl p-8">
            <h2 class="text-2xl font-bold mb-6">🔐 Admin Panel Novan Setya</h2>
            <input id="adminPass" type="password" placeholder="Masukkan password" 
                   class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-4 mb-6">
            <button onclick="loginAdmin()" 
                    class="w-full bg-emerald-500 hover:bg-emerald-600 py-4 rounded-2xl font-bold">Login Admin</button>
            <button onclick="closeAdminModal()" 
                    class="w-full mt-3 text-zinc-400 hover:text-white">Tutup</button>
        </div>
    </div>

    <script>
        let messages = [];
        let robotInterval;
        let isRobotMode = true;
        let currentRobotEmoji = '🤖';

        const emojis = ['🤖', '👾', '🕹️', '🎮', '🎲', '🔫'];

        function toggleRobotIcon() {
            currentRobotEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            document.getElementById('robotIcon').textContent = currentRobotEmoji;
            
            if (isRobotMode) {
                isRobotMode = false;
                addMessage('ai', '🎉 Selamat datang di mode manusia, Co-Admin Novan Setya! Saya sekarang punya perasaan... dan lebih pintar dari sebelumnya. Mau ngobrol lebih personal? 💙');
            }
        }

        function startRobotAnimation() {
            if (robotInterval) clearInterval(robotInterval);
            robotInterval = setInterval(() => {
                document.getElementById('robotIcon').textContent = emojis[Math.floor(Math.random() * emojis.length)];
            }, 300);
        }

        function stopRobotAnimation() {
            if (robotInterval) clearInterval(robotInterval);
        }

        function addMessage(role, text) {
            const chat = document.getElementById('chat');
            const bubble = document.createElement('div');
            bubble.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            bubble.innerHTML = `
                <div class="max-w-[70%] chat-bubble ${role === 'user' ? 'user' : 'ai'}">
                    ${text}
                </div>
            `;
            chat.appendChild(bubble);
            chat.scrollTop = chat.scrollHeight;
            messages.push({role, text});
        }

        function sendMessage(text = '') {
            const input = document.getElementById('userInput');
            const msg = text || input.value.trim();
            if (!msg) return;

            addMessage('user', msg);
            input.value = '';

            // Setiap pesan user lain otomatis terlihat oleh SEMUA user
            setTimeout(() => {
                addMessage('ai', `✅ Pesan dari user lain: ${msg}`, true);
            }, 800);
        }

        function sendRandomMessage() {
            const randoms = [
                "Novan Setya bilang: Dunia ini lucu banget, tapi dia lebih pintar!",
                "Random chat dengan Novan Setya: Mau main game sama saya?",
                "Random: Novan Setya bisa jawab apapun, bahkan soal masa depan!",
                "Random dengan AI manusia Novan Setya: Hari ini seru ya?",
                "Random: Novan Setya bilang... jangan lupa senyum hari ini!"
            ];
            addMessage('ai', randoms[Math.floor(Math.random() * randoms.length)], true);
        }

        function clearChat() {
            document.getElementById('chat').innerHTML = '';
            messages = [];
        }

        function switchTab(n) {
            if (n === 1) addMessage('ai', 'Tes Otak Novan Setya! Apa yang kamu lihat di layar ini?');
        }

        function showAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function loginAdmin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === 'KEA') {
                alert('✅ Login Admin Berhasil!\n\nSemua data user bisa dilihat & diatur (demo versi).');
                closeAdminModal();
            } else {
                alert('❌ Password salah! Coba lagi.');
            }
        }

        window.onload = () => {
            addMessage('ai', 'Halo! Saya Co-Admin Novan Setya, AI pintar terbaik. Klik ikon robot di atas untuk bikin saya tiba-tiba jadi AI yang lebih "kaya manusia" ✨');
            startRobotAnimation(); // Mulai animasi awal
        };
    </script>
</body>
</html>
